<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  
  <!-- User head -->
  <circle cx="100" cy="70" r="40" fill="url(#avatarGrad)" opacity="0.2"/>
  <circle cx="100" cy="70" r="30" fill="url(#avatarGrad)" opacity="0.4"/>
  
  <!-- User body -->
  <ellipse cx="100" cy="140" rx="55" ry="45" fill="url(#avatarGrad)" opacity="0.3"/>
  
  <!-- User face outline -->
  <circle cx="100" cy="70" r="35" fill="none" stroke="url(#avatarGrad)" stroke-width="3"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="62" rx="5" ry="6" fill="#4f46e5"/>
  <ellipse cx="112" cy="62" rx="5" ry="6" fill="#4f46e5"/>
  
  <!-- Smile -->
  <path d="M85 80 Q100 95 115 80" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Initials "Q" -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" 
        font-weight="bold" font-size="40" fill="#6366f1" opacity="0.6">Q</text>
</svg>